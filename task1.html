
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Train Ticket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="train-page">

  <main class="container py-5">
    <section class="ticket-card mx-auto">

      <header class="ticket-header">
        <h1>Book a train ticket</h1>
      </header>

      <form class="ticket-form" action="#" method="get">

        
        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>

          <div class="trip-options">
            <input class="btn-check" type="radio"
                   name="trip" id="oneway"
                   value="oneway" checked>
            <label class="btn trip-btn" for="oneway">
              One way
            </label>

            <input class="btn-check" type="radio"
                   name="trip" id="roundtrip"
                   value="roundtrip">
            <label class="btn trip-btn" for="roundtrip">
              Round trip
            </label>
          </div>
        </fieldset>

     
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="from" class="form-label">From</label>
            <input type="text" class="form-control"
                   id="from" name="from"
                   placeholder="Astana" required>
          </div>

          <div class="col-md-6">
            <label for="to" class="form-label">To</label>
            <input type="text" class="form-control"
                   id="to" name="to"
                   placeholder="Almaty" required>
          </div>
        </div>


        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="departure" class="form-label">
              Departure
            </label>
            <input type="date" class="form-control"
                   id="departure" name="departure" required>
          </div>

          <div class="col-md-4">
            <label for="return" class="form-label">
              Return
            </label>
            <input type="date" class="form-control"
                   id="return" name="return">
          </div>

          <div class="col-md-4">
            <label for="passengers" class="form-label">
              Passengers
            </label>
            <select class="form-select"
                    id="passengers" name="passengers"
                    required>
              <option value="" selected disabled>
  Choose passengers
</option>
<option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

       
        <fieldset class="mb-4">
          <legend class="form-label">Carriage class</legend>

          <div class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio"
                     name="carriage" id="seat"
                     value="seat" required>
              <label class="form-check-label" for="seat">
                Seat
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio"
                     name="carriage" id="coupe"
                     value="coupe" required>
              <label class="form-check-label" for="coupe">
                Coupé
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio"
                     name="carriage" id="sleeper"
                     value="sleeper" required>
              <label class="form-check-label" for="sleeper">
                Sleeper
              </label>
            </div>
          </div>
        </fieldset>

       
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control"
                     id="phone" name="phone"
                     placeholder="701 234 56 78"
                     required>
            </div>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control"
                   id="email" name="email"
                   placeholder="name@example.com" required>
          </div>
        </div>

       
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox"
                 role="switch" id="sms" name="sms">
          <label class="form-check-label" for="sms">
            Also send the ticket by SMS
          </label>
        </div>

        
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox"
                 id="agreement" name="agreement" required>
          <label class="form-check-label" for="agreement">
            I agree with the carriage rules
          </label>
        </div>

      
        <div class="ticket-actions d-flex gap-2 justify-content-end">
          <button type="reset" class="btn clear-btn">
            Clear
          </button>
          <button type="submit" class="btn find-btn">
            Find trains
          </button>
        </div>

      </form>
    </section>
  </main>

</body>
</html>
