
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Table Reservation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="cafe-page">

<main class="container py-5">
  <section class="cafe-card mx-auto">

    <header class="cafe-header text-center">
      <p class="cafe-subtitle">WELCOME TO OUR CAFÉ</p>
      <h1>Reserve a Table</h1>
      <p>Enjoy your perfect dining experience.</p>
    </header>

    <form class="cafe-form" action="#" method="get">

      <div class="row g-3">

        
        <div class="col-md-6">
          <label for="guestName" class="form-label">
            Your name *
          </label>
          <input type="text" class="form-control"
                 id="guestName" name="guestName"
                 placeholder="Enter your full name"
                 autocomplete="name" required>
        </div>

       
        <div class="col-md-6">
          <label for="guestEmail" class="form-label">
            Email *
          </label>
          <input type="email" class="form-control"
                 id="guestEmail" name="guestEmail"
                 placeholder="name@example.com"
                 autocomplete="email" required>
        </div>

      
        <div class="col-md-6">
          <label for="guestPhone" class="form-label">
            Phone *
          </label>
          <input type="tel" class="form-control"
                 id="guestPhone" name="guestPhone"
                 placeholder="+7 701 234 56 78"
                 autocomplete="tel" required>
        </div>

       
        <div class="col-md-6">
          <label for="guests" class="form-label">
            Number of guests *
          </label>
          <input type="number" class="form-control"
                 id="guests" name="guests"
                 min="1" max="20" step="1"
                 value="2" required>
        </div>

       
        <div class="col-12">
          <label for="reservationDate" class="form-label">
            Reservation date *
          </label>
          <input type="date" class="form-control"
                 id="reservationDate" name="reservationDate"
                 required>
        </div>

        
        <fieldset class="col-12">
          <legend class="form-label">
            Seating preference *
          </legend>

          <div class="d-flex flex-wrap gap-4">
            <div class="form-check">
              <input class="form-check-input" type="radio"
                     id="inside" name="seating"
                     value="inside" required>
              <label class="form-check-label" for="inside">
                Inside
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio"
                     id="terrace" name="seating"
                     value="terrace">
              <label class="form-check-label" for="terrace">
                Terrace
              </label>
            </div>
          </div>
        </fieldset>

       
        <div class="col-12">
          <label for="meal" class="form-label">
            Meal preference *
          </label>
          <select class="form-select"
                  id="meal" name="meal" required>
            <option value="" selected disabled>
              Choose your meal
            </option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

       
        <div class="col-12">
          <label for="comments" class="form-label">
            Additional comments
          </label>
          <textarea class="form-control"
                    id="comments" name="comments"
                    rows="4"
                    placeholder="Any special requests?"></textarea>
        </div>

       
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   id="terms" name="terms" required>
            <label class="form-check-label" for="terms">
              I agree to the reservation terms *
            </label>
          </div>
        </div>

        
        <div class="col-12 mt-4">
          <button type="submit" class="btn cafe-submit w-100">
            Reserve a Table
          </button>
        </div>

      </div>
    </form>

    <footer class="cafe-footer text-center">
      We look forward to welcoming you!
    </footer>

  </section>
</main>

</body>
</html>
